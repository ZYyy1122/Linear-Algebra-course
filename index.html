<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Pages 测试页面</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .box {
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px #0002;
    }

    h1 {
      color: #2563eb;
    }

    button {
      padding: 10px 20px;
      color: white;
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>GitHub Pages 测试成功</h1>

    <p>这是我的第一个静态网页。</p>

    <p>当前时间：<span id="time"></span></p>

    <button onclick="showMessage()">点击测试</button>

    <p id="message"></p>
  </div>

  <script>
    document.getElementById("time").textContent =
      new Date().toLocaleString("zh-CN");

    function showMessage() {
      document.getElementById("message").textContent =
        "JavaScript 工作正常！";
    }
  </script>
</body>
</html>
